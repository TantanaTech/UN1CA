name: Build A04s Port

on:
  workflow_dispatch:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      # KRİTİK: "Committer identity unknown" hatasını bu adım çözer
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle
            /var/cache/apt/archives
          key: ${{ runner.os }}-build-${{ hashFiles('scripts/build_dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq eatmydata
          DEBIAN_FRONTEND=noninteractive sudo eatmydata apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          
          mkdir -p security
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Fix gdown version for legacy scripts
        run: |
          pip install --upgrade pip
          pip install gdown==4.7.1

      - name: Build dependencies
        run: |
          source ./buildenv.sh a04s
          export USE_CCACHE=1
          ./scripts/build_dependencies.sh

      - name: Download A04s Firmware
        run: |
          source ./buildenv.sh a04s
          ./scripts/download_fw.sh "SM-A047F" "TUR"

      - name: Extract A04s Firmware
        run: |
          source ./buildenv.sh a04s
          ./scripts/extract_fw.sh "SM-A047F" "TUR"

      - name: Build ROM
        run: |
          source ./buildenv.sh a04s
          ./scripts/make_rom.sh --force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-A04s-OneUI7
          path: out/*.zip
          
