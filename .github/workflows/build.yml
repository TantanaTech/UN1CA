name: Build A04s Port

on:
  workflow_dispatch:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1 # Sadece son commit'i alarak hızlandırır

      
       - name: Free disk space
         run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
          

      # HIZLANDIRMA: APT ve Build Araçları için Cache
      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle
            /var/cache/apt/archives
          key: ${{ runner.os }}-build-${{ hashFiles('scripts/build_dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Set up build environment
        run: |
          [span_3](start_span)sudo apt update[span_3](end_span)
          # eatmydata kurulumu hızlandırır (fsync'i devre dışı bırakır)
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq eatmydata
          DEBIAN_FRONTEND=noninteractive sudo eatmydata apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            [span_4](start_span)libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp[span_4](end_span)
          sudo modprobe erofs f2fs
          
          # [span_5](start_span)Güvenlik anahtarları[span_5](end_span)
          mkdir -p security
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Gradle bağımlılıklarını cache'ler

      - name: Build dependencies
        run: |
          [span_6](start_span)source ./buildenv.sh a04s[span_6](end_span)
          # ccache kullanarak derlemeyi hızlandır
          export USE_CCACHE=1
          [span_7](start_span)./scripts/build_dependencies.sh[span_7](end_span)

      - name: Download A04s Firmware (Direct Link)
        run: |
          [span_8](start_span)source ./buildenv.sh a04s[span_8](end_span)
          [span_9](start_span)./scripts/download_fw.sh "SM-A047F" "TUR"[span_9](end_span)

      - name: Extract A04s Firmware
        run: |
          [span_10](start_span)source ./buildenv.sh a04s[span_10](end_span)
          [span_11](start_span)./scripts/extract_fw.sh "SM-A047F" "TUR"[span_11](end_span)

      - name: Build ROM
        run: |
          [span_12](start_span)source ./buildenv.sh a04s[span_12](end_span)
          [span_13](start_span)./scripts/make_rom.sh --force[span_13](end_span)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-A04s-OneUI7
          path: out/*.zip 
          
